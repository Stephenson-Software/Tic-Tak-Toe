name: Browser build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

env:
  # the Strata release whose grid relay draws the browser's 3D view
  STRATA_RELAY_VERSION: "0.9.0"

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # pygbag packs only what is under src/, so a pip-installed graphik would be missing in
      # the browser. Install the exact line requirements.txt pins into src/ for this build
      # only (it is never committed).
      - name: Put graphik into src for the web build
        run: |
          GRAPHIK="$(grep -E '^graphik @ ' requirements.txt)"
          python3 -m pip install --no-deps --target src "$GRAPHIK"
          rm -rf src/*.dist-info

      # pygbag packs src/ (main.py is its entry point) into a page that loads CPython and
      # pygame-ce compiled to WebAssembly from pygame-web.github.io. The page is graphik's
      # pygbag template: pygbag 0.9.3's default page plus a 2D/3D button and the Strata grid
      # relay's canvas. It starts in 3D (the template's default, as on the desktop), loading
      # the relay alongside the game, and falls back to 2D with the reason if 3D can't start;
      # a player's choice of 2D is remembered, and ?view=2d starts in 2D without downloading
      # anything of the 3D view.
      - name: Build with pygbag
        run: |
          python3 -m pip install pygbag==0.9.3
          TEMPLATE="$(PYTHONPATH=src python3 -c 'from preponderous.graphik.grid3d.web import templatePath; print(templatePath())')"
          python3 -m pygbag --build --template "$TEMPLATE" src

      # The 3D view's files (Strata's prebuilt grid relay), from Strata's release, checked
      # against its SHA256SUMS, next to the page. Pinned: the relay's wire format must match
      # graphik's grid3d.web.
      - name: Put Strata's grid relay next to the page
        run: |
          PYTHONPATH=src python3 -m preponderous.graphik.grid3d.relay --strata ${{ env.STRATA_RELAY_VERSION }} --dest src/build/web

      - name: Check the build
        run: |
          test -f src/build/web/index.html
          test -f src/build/web/grid-relay.js
          grep -q 'id="graphik3d"' src/build/web/index.html
          ls -la src/build/web

      # arcade versions are immutable, so every deployed commit gets its own version
      - name: Write the version
        run: echo "$(cat version.txt)+g${GITHUB_SHA::7}" > "$RUNNER_TEMP/arcade-version.txt"

      - name: Deploy to arcade
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.ARCADE_ENABLED == 'true')
        uses: Stephenson-Software/arcade-deploy@v1
        with:
          slug: tic-tak-toe
          token: ${{ secrets.ARCADE_TOKEN }}
          site-dir: src/build/web
          version-file: ${{ runner.temp }}/arcade-version.txt
